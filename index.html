<style>
  :root {
    --bg: #0e1117;
    --panel: #161b22;
    --panel-2: #1c2230;
    --border: #2a3140;
    --text: #e6e8eb;
    --text-dim: #9aa4b2;
    --accent: #4fc3f7;
    --up: #ef5350;      /* Japanese convention: red = up */
    --down: #42a5f5;    /* blue = down */
    --flat: #9aa4b2;
    --badge-p: #4fc3f7;
    --badge-g: #66bb6a;
    --badge-s: #ffb74d;
    --stophigh: #ef5350;
    --row-hover: #1e2530;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 18px 24px 8px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 {
    font-size: 18px;
    margin: 0;
    letter-spacing: 0.02em;
  }
  header .meta {
    color: var(--text-dim);
    font-size: 12px;
  }
  .export-btn {
    background: var(--accent);
    color: #0e1117;
    border: none;
    border-radius: 6px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .export-btn:hover { opacity: 0.85; }
  nav.tabs {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    padding: 10px 24px 0;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  nav.tabs button {
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 10px 14px;
    font-size: 13px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  nav.tabs button .cnt {
    color: var(--text-dim);
    font-size: 11px;
    margin-left: 4px;
  }
  nav.tabs button.active {
    color: var(--text);
    border-bottom-color: var(--accent);
    font-weight: 600;
  }
  main { padding: 16px 24px 40px; }
  .table-wrap {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    background: var(--panel);
  }
  thead th {
    position: sticky;
    top: 0;
    background: var(--panel-2);
    color: var(--text-dim);
    text-align: right;
    font-weight: 600;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  thead th.col-text, thead th.col-name { text-align: left; }
  thead th.col-badge { text-align: center; }
  thead th .arrow { color: var(--accent); margin-left: 4px; }
  tbody td {
    padding: 8px 12px;
    text-align: right;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody td.col-text, tbody td.col-name { text-align: left; }
  tbody td.col-badge { text-align: center; }
  tbody tr:hover { background: var(--row-hover); }
  tbody tr:last-child td { border-bottom: none; }
  .rank {
    color: var(--text-dim);
    font-size: 11px;
    width: 28px;
    text-align: right;
    padding-right: 6px;
  }
  .up { color: var(--up); }
  .down { color: var(--down); }
  .flat { color: var(--flat); }
  .dash { color: var(--text-dim); }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
    color: #0e1117;
  }
  .badge-p { background: var(--badge-p); }
  .badge-g { background: var(--badge-g); }
  .badge-s { background: var(--badge-s); }
  .badge-default { background: var(--text-dim); }
  .code-link {
    color: var(--accent);
    text-decoration: none;
  }
  .code-link:hover { text-decoration: underline; }
  .code-link:visited { color: var(--accent); }
  .stophigh-badge {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 6px;
    border-radius: 4px;
    background: var(--stophigh);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    vertical-align: middle;
  }
  .empty-note {
    padding: 40px;
    text-align: center;
    color: var(--text-dim);
  }
  footer {
    padding: 16px 24px 32px;
    color: var(--text-dim);
    font-size: 11px;
  }
</style>
</head>

<header>

</main>

let currentTab = DATA.order[0];
let sortState = {}; // per-tab: {key, dir}

function fmtInt(v) {
  if (v === null || v === undefined) return '<span class="dash">－</span>';
  return Math.round(v).toLocaleString('ja-JP');
}
function fmtPrice(v) {
  if (v === null || v === undefined) return '<span class="dash">－</span>';
  return Number(v).toLocaleString('ja-JP');
}
function fmtChange(v) {
  if (v === null || v === undefined) return '<span class="dash">－</span>';
  const cls = v > 0 ? 'up' : v < 0 ? 'down' : 'flat';
  const sign = v > 0 ? '+' : '';
  return `<span class="${cls}">${sign}${Number(v).toLocaleString('ja-JP')}</span>`;
}
function fmtPct(v) {
  if (v === null || v === undefined) return '<span class="dash">－</span>';
  const pct = v * 100;
  const cls = pct > 0 ? 'up' : pct < 0 ? 'down' : 'flat';
  const sign = pct > 0 ? '+' : '';
  return `<span class="${cls}">${sign}${pct.toFixed(2)}%</span>`;
}
function fmtRatio(v) {
  if (v === null || v === undefined) return '<span class="dash">－</span>';
  return Number(v).toFixed(2);
}
function fmtYield(v) {
  if (v === null || v === undefined) return '<span class="dash">－</span>';
  return Number(v).toFixed(2) + '%';
}
function marketBadgeClass(m) {
  if (!m) return 'badge-default';
  if (m.indexOf('Ｐ') !== -1 || m.indexOf('P') !== -1) return 'badge-p';
  if (m.indexOf('Ｇ') !== -1 || m.indexOf('G') !== -1) return 'badge-g';
  if (m.indexOf('Ｓ') !== -1 || m.indexOf('S') !== -1) return 'badge-s';
  return 'badge-default';
}
function fmtBadge(v) {
  if (!v) return '<span class="dash">－</span>';
  return `<span class="badge ${marketBadgeClass(v)}">${v}</span>`;
}
function fmtName(row) {
  const stop = row.stop_high ? '<span class="stophigh-badge">S高</span>' : '';
  return `${escapeHtml(row.name || '')}${stop}`;
}
function fmtCode(v) {
  if (v === null || v === undefined || v === '') return '<span class="dash">－</span>';
  const code = String(v);
  const url = `https://kabutan.jp/stock/?code=${encodeURIComponent(code)}`;
  return `<a class="code-link" href="${url}" target="_blank" rel="noopener noreferrer">${escapeHtml(code)}</a>`;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function cellHtml(col, row) {
  const v = row[col.key];
  switch (col.type) {
    case 'name': return fmtName(row);
    case 'code': return fmtCode(v);
    case 'badge': return fmtBadge(v);
    case 'price': return fmtPrice(v);
    case 'change': return fmtChange(v);
    case 'pct': return fmtPct(v);
    case 'ratio': return fmtRatio(v);
    case 'yieldpct': return fmtYield(v);
    case 'number': return fmtInt(v);
    default: return v === null || v === undefined ? '<span class="dash">－</span>' : escapeHtml(v);
  }
}

function colClass(col) {
  if (col.type === 'name') return 'col-name';
  if (col.type === 'code') return 'col-text';
  if (col.type === 'badge') return 'col-badge';
  if (col.type === 'text') return 'col-text';
  return 'col-num';
}

function renderTabs() {
  const nav = document.getElementById('tabs');
  nav.innerHTML = '';
  DATA.tabs.forEach(t => {
    const btn = document.createElement('button');
    btn.textContent = t.label;
    btn.className = t.key === currentTab ? 'active' : '';
    const cnt = document.createElement('span');
    cnt.className = 'cnt';
    cnt.textContent = `(${t.count})`;
    btn.appendChild(cnt);
    btn.addEventListener('click', () => {
      currentTab = t.key;
      renderTabs();
      renderTable();
    });
    nav.appendChild(btn);
  });
}

function sortedRows(key) {
  const sheet = DATA.sheets[key];
  const rows = sheet.rows.slice();
  const st = sortState[key];
  if (!st) return rows;
  const { col, dir } = st;
  rows.sort((a, b) => {
    let av = a[col], bv = b[col];
    if (av === null || av === undefined) av = -Infinity;
    if (bv === null || bv === undefined) bv = -Infinity;
    if (typeof av === 'string' || typeof bv === 'string') {
      av = String(a[col] ?? '');
      bv = String(b[col] ?? '');
      return dir === 'asc' ? av.localeCompare(bv, 'ja') : bv.localeCompare(av, 'ja');
    }
    return dir === 'asc' ? av - bv : bv - av;
  });
  return rows;
}

  theadRow.innerHTML = '';
  tbody.innerHTML = '';

  const rankTh = document.createElement('th');
  rankTh.textContent = '#';
  rankTh.style.cursor = 'default';
  theadRow.appendChild(rankTh);

  cols.forEach(col => {
    const th = document.createElement('th');
    th.className = colClass(col);
    const st = sortState[currentTab];
    const arrow = (st && st.col === col.key) ? `<span class="arrow">${st.dir === 'asc' ? '▲' : '▼'}</span>` : '';
    th.innerHTML = `${col.label}${arrow}`;
    th.addEventListener('click', () => {
      const cur = sortState[currentTab];
      let dir = 'desc';
      if (cur && cur.col === col.key) dir = cur.dir === 'desc' ? 'asc' : 'desc';
      sortState[currentTab] = { col: col.key, dir };
      renderTable();
    });
    theadRow.appendChild(th);
  });

  const rows = sortedRows(currentTab);
  if (rows.length === 0) {
    emptyNote.style.display = 'block';
  } else {
    emptyNote.style.display = 'none';
    const frag = document.createDocumentFragment();
    rows.forEach((row, i) => {
      const tr = document.createElement('tr');
      const rankTd = document.createElement('td');
      rankTd.className = 'rank';
      rankTd.textContent = i + 1;
      tr.appendChild(rankTd);
      cols.forEach(col => {
        const td = document.createElement('td');
        td.className = colClass(col);
        td.innerHTML = cellHtml(col, row);
        tr.appendChild(td);
      });
      frag.appendChild(tr);
    });
    tbody.appendChild(frag);
  }
}

function buildExportSheet(key) {
  const sheet = DATA.sheets[key];
  const cols = DATA.columns[key];
  const header = ['#', ...cols.map(c => c.label)];
  const aoa = [header];
  sheet.rows.forEach((row, i) => {
    const line = [i + 1];
    cols.forEach(col => {
      let v = row[col.key];
      if (col.type === 'pct' && v !== null && v !== undefined) {
        v = Math.round(v * 10000) / 10000; // numeric fraction, not string
      }
      if (v === null || v === undefined) v = '';
      if (col.type === 'name' && row.stop_high) v = `${v}(S高)`;
      line.push(v);
    });
    aoa.push(line);
  });
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  // format 前日比(%) column as percentage, numeric
  const pctColIdx = cols.findIndex(c => c.type === 'pct');
  if (pctColIdx !== -1) {
    const colLetter = XLSX.utils.encode_col(pctColIdx + 1); // +1 for rank col
    for (let r = 2; r <= aoa.length; r++) {
      const addr = `${colLetter}${r}`;
      if (ws[addr] && typeof ws[addr].v === 'number') {
        ws[addr].z = '0.00%';
      }
    }
  }
  return ws;
}

function exportExcel() {
  if (typeof XLSX === 'undefined') {
    setExportStatus('Excel出力ライブラリを読み込めませんでした（インターネット接続を確認してください）', true);
    return;
  }
  try {
    const wb = XLSX.utils.book_new();
    DATA.order.forEach(key => {
      const ws = buildExportSheet(key);
      XLSX.utils.book_append_sheet(wb, ws, DATA.sheets[key].label.substring(0, 31));
    });
    const today = new Date();
    const stamp = `${today.getFullYear()}${String(today.getMonth()+1).padStart(2,'0')}${String(today.getDate()).padStart(2,'0')}`;
    XLSX.writeFile(wb, `daily_ranking_${stamp}.xlsx`);
    setExportStatus('');
  } catch (e) {
    setExportStatus('Excel出力中にエラーが発生しました: ' + e.message, true);
  }
}

function setExportStatus(msg, isError) {
  const el = document.getElementById('export-status');
  if (!el) return;
  el.textContent = msg;
  el.style.color = isError ? 'var(--up)' : 'var(--text-dim)';
}

document.getElementById('exportBtn').addEventListener('click', exportExcel);
document.getElementById('generated-meta').textContent =
  `生成日時: ${new Date().toLocaleString('ja-JP')}`;

renderTabs();
renderTable();
</script>
