const ORDER = ["活況銘柄", "S高", "P高値", "S高値", "G高値", "P売買高", "S売買高", "G売買高"];
const COL_DEFS = {
  A: [
    {key:"code", label:"銘柄コード", type:"code"},
    {key:"name", label:"銘柄名", type:"text"},
    {key:"market", label:"市場", type:"market"},
    {key:"close", label:"終値", type:"num"},
    {key:"change", label:"前日比", type:"num"},
    {key:"changePct", label:"前日比(%)", type:"pct"},
    {key:"volume", label:"出来高", type:"num"},
    {key:"per", label:"PER", type:"raw"},
    {key:"pbr", label:"PBR", type:"raw"},
    {key:"yieldv", label:"利回り", type:"raw"},
  ],
  B: [
    {key:"code", label:"銘柄コード", type:"code"},
    {key:"name", label:"銘柄名", type:"text"},
    {key:"close", label:"終値", type:"num"},
    {key:"changePct", label:"前日比(%)", type:"pct"},
    {key:"value", label:"売買代金", type:"num"},
    {key:"volume", label:"出来高", type:"num"},
  ]
};
const LABEL_OVERRIDES = { "活況銘柄": { volume: "約定回数" } };
const HIDDEN_COLUMNS = { "S高": ["volume"], "P高値": ["volume"], "S高値": ["volume"], "G高値": ["volume"] };
let activeTab = ORDER[0], sortKey = null, sortDir = "asc";
function badgeClass(m) {
  if (!m) return "badge-e";
  if (m.includes("Ｐ")) return "badge-p";
  if (m.includes("Ｓ")) return "badge-s";
  if (m.includes("Ｇ")) return "badge-g";
  if (m.includes("Ｅ")) return "badge-e";
  return "badge-n";
}
function fmt(v) {
  if (v === null || v === undefined || v === "－" || v === "") return '<span class="dash">－</span>';
  if (typeof v === "number") return v.toLocaleString("ja-JP");
  return v;
}
function fmtPct(v) {
  if (v === null || v === undefined || v === "" || v === "－") return '<span class="dash">－</span>';
  const n = Number(v); const sign = n > 0 ? "+" : "";
  return sign + n.toFixed(2);
}
function pctClass(v) { const n = Number(v); if (!isFinite(n) || n === 0) return "flat"; return n > 0 ? "up" : "down"; }

function getColsFor(name) {
  const base = COL_DEFS[SHEETS[name].type];
  const overrides = LABEL_OVERRIDES[name] || {};
  const hidden = HIDDEN_COLUMNS[name] || [];
  return base.filter(c => !hidden.includes(c.key)).map(c => overrides[c.key] ? Object.assign({}, c, {label: overrides[c.key]}) : c);
}
function getCols() { return getColsFor(activeTab); }
function renderTabs() {
  document.getElementById("tabs").innerHTML = ORDER.map(name => {
    const cnt = SHEETS[name].rows.length;
    return `<button class="${name === activeTab ? "tab active" : "tab"}" onclick="selectTab('${name}')">${name}<span class="cnt">${cnt}</span></button>`;
  }).join("");
}
function selectTab(name) { activeTab = name; sortKey = null; sortDir = "asc"; renderTable(); renderTabs(); }
function getSorted(rows) {
  if (!sortKey) return rows;
  const copy = [...rows];
  copy.sort((a, b) => {
    let va = a[sortKey], vb = b[sortKey];
    const na = Number(va), nb = Number(vb);
    let cmp = (!isNaN(na) && !isNaN(nb) && va !== null && va !== "－" && vb !== null && vb !== "－")
      ? na - nb : String(va ?? "").localeCompare(String(vb ?? ""), "ja");
    return sortDir === "asc" ? cmp : -cmp;
  });
  return copy;
}
function handleSort(key) { if (sortKey === key) sortDir = sortDir === "asc" ? "desc" : "asc"; else { sortKey = key; sortDir = "asc"; } renderTable(); }
function cellHTML(col, row) {
  const v = row[col.key];
  switch (col.type) {
    case "code": return `<span class="code-link" onclick="openKabutan('${v}')">${v}</span>`;
    case "market": return `<span class="badge ${badgeClass(v)}">${v || ""}</span>`;
    case "pct": return `<span class="${pctClass(v)}">${fmtPct(v)}</span>`;
    case "num":
      if (col.key === "change") {
        const cls = Number(v) > 0 ? "up" : Number(v) < 0 ? "down" : "flat";
        const sign = Number(v) > 0 ? "+" : "";
        return v === null || v === "－" ? '<span class="dash">－</span>' : `<span class="${cls}">${sign}${fmt(v)}</span>`;
      }
      return fmt(v);
    case "raw": return fmt(v);
    default:
      let txt = v === null || v === undefined ? "" : v;
      let stopBadge = col.key === "name" && row.stop ? `<span class="stop-flag">${row.stop}</span>` : "";
      return txt + stopBadge;
  }
}
function renderTable() {
  const cols = getCols();
  const sorted = getSorted(SHEETS[activeTab].rows);

    const arrow = sortKey === col.key ? (sortDir === "asc" ? " ▲" : " ▼") : " ⇅";
    return `<th${cls} onclick="handleSort('${col.key}')">${col.label}${arrow}</th>`;
  }).join("");
  document.getElementById("tbody").innerHTML = sorted.map(row =>
    "<tr>" + cols.map(col => {
      const cls = col.type !== "text" && col.type !== "market" && col.type !== "code" ? ' class="num"' : (col.type === "text" ? ' class="name"' : "");
      return `<td${cls}>${cellHTML(col, row)}</td>`;
    }).join("") + "</tr>"
  ).join("");

}
function sheetExportData(name) {
  const cols = getColsFor(name);
  const rows = SHEETS[name].rows;
  const header = cols.map(c => c.label);
  const body = rows.map(r => cols.map(c => {
    const v = r[c.key];
    if (c.type === "pct") return v === null || v === undefined ? "" : Math.round(Number(v) * 100) / 100;
    return v === null || v === undefined ? "" : v;
  }));
  return { header, body };
}
function downloadExcel() {
  const wbook = XLSX.utils.book_new();
  ORDER.forEach(name => {
    const { header, body } = sheetExportData(name);
    const ws = XLSX.utils.aoa_to_sheet([header, ...body]);
    XLSX.utils.book_append_sheet(wbook, ws, name.slice(0, 31));
  });
  XLSX.writeFile(wbook, "デイリーランキング_全シート.xlsx");
}
